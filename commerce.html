                    states.forEach((state) => {
                        if (/\s/.test(state.character) || pass < state.startDelay) return;
                        if (pass < state.startDelay + state.substitutions) {
                            state.span.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
                            return;
                        }
                        state.span.style.opacity = '0';
                    });
                    pass += 1;
                }, 90);
            });
        }
        function morphText(element, fromText, toText, job) {
            const from = Array.from(fromText);
            const to = Array.from(toText);
            delete element.dataset.isLeaving;
            const length = Math.max(from.length, to.length);
            if (!length) {
                element.textContent = '';
                element.dataset.glitchText = '';
                return Promise.resolve(true);
            }
            element.textContent = '';
            const states = Array.from({ length }, (_, index) => {
                const oldCharacter = from[index] || '';
                const newCharacter = to[index] || '';
                const span = document.createElement('span');
                span.textContent = oldCharacter;
                span.style.opacity = oldCharacter ? '1' : '0';
                element.append(span);
                return {
                    oldCharacter, newCharacter, span,
                    startDelay: index === 0 ? 0 : Math.floor(Math.random() * 4),
                    substitutions: 4 + Math.floor(Math.random() * 5)
                };
            });
            const totalPasses = Math.max(...states.map((state) => state.startDelay + state.substitutions));
            let pass = 0;
            return new Promise((resolve) => {
                let timer;
                const step = () => {
                    if (!isCurrentTextAnimation(element, job)) {
                        clearInterval(timer);
                        return resolve(false);
                    }
                    states.forEach((state) => {
                        if (pass < state.startDelay) return;
                        if (pass < state.startDelay + state.substitutions) {
                            state.span.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
                            state.span.style.opacity = '1';
                            return;
                        }
                        state.span.textContent = state.newCharacter;
                        state.span.style.opacity = state.newCharacter ? '1' : '0';
                    });
                    if (pass > totalPasses) {
                        element.textContent = toText;
                        element.dataset.glitchText = toText;
                        clearInterval(timer);
                        return resolve(true);
                    }
                    pass += 1;
                };
                timer = setInterval(step, 90);
                step();
            });
        }
        function revealSequence(items, job) {
            return Promise.all(items.map(([element, text]) => {
                const elementJob = startTextAnimation(element);
                const previousText = element.textContent;
                if (previousText && previousText !== text) return morphText(element, previousText, text, elementJob);
                return scrambleText(element, text, elementJob);
            })).then((results) => results.every(Boolean));
        }
        function reverseSequence(items, job) {
            return Promise.all(items.map(([element, text]) => reverseScrambleText(element, text, startTextAnimation(element)))).then((results) => results.every(Boolean));
        }
        function getTextItems(selector, root = document) {
            return Array.from(root.querySelectorAll(selector))
                .filter((element) => (element.dataset.glitchText || element.textContent).length)
                .map((element) => [element, element.dataset.glitchText || element.textContent]);
        }
        function getOptionsScreenText() {
            return [
                ...getTextItems('#menu-eyebrow, #menu-title'),
                ...getTextItems('.menu-title, .menu-subtitle', menu),
                ...getTextItems('.solution-title, .solution-subtitle, .competency-stack-line', solutionList)
            ];
        }
        function getDetailScreenText() {
            return getTextItems('.detail-kicker, .detail-title, .detail-lead, .timeline-value, .timeline-caption, .detail-package-title, .detail-extras-title, .detail-package strong, .detail-package span, .detail-result-lead, .detail-effects-title, .detail-effects strong, .detail-effects span, .detail-cta-text, .telegram-contact', detailPanel);
        }
        function prepareTextForReveal(items) {
            items.forEach(([element]) => {
                startTextAnimation(element);
                element.textContent = '';
                element.style.opacity = '1';
            });
        }
        function revealMenu(job, includeHeader = true) {
            const items = Array.from(menu.querySelectorAll('button')).flatMap((button) => [
                [button.querySelector('.menu-title'), button.querySelector('.menu-title').dataset.targetText],
                [button.querySelector('.menu-subtitle'), button.querySelector('.menu-subtitle').dataset.targetText]
            ]);
            if (includeHeader) items.unshift([document.getElementById('menu-title'), copy[currentLanguage].title], [document.getElementById('menu-eyebrow'), copy[currentLanguage].eyebrow]);
            const animation = revealSequence(items, job);
            menuScreen.classList.add('is-content-ready');
            return animation.then((result) => {
                menu.querySelectorAll('button[data-remove-after-morph="true"]').forEach((button) => button.closest('li').remove());
                return result;
            });
        }
        function revealSolutions(job) {
            const items = [];
            solutionList.querySelectorAll('button').forEach((button) => {
                const title = button.querySelector('.solution-title');
                const subtitle = button.querySelector('.solution-subtitle');
                items.push([title, title.dataset.targetText || '']);
                items.push([subtitle, subtitle.dataset.targetText || '']);
            });
            return revealSequence(items, job).then((result) => {
                if (result) solutionList.querySelectorAll('li[data-remove-after-reveal="true"]').forEach((row) => row.remove());
                if (result) {
                    enableSolutionScrollIfOverflowing();
                    logSuboptionsState('text-reveal-complete');
                }
                requestAnimationFrame(refreshCustomScrollbars);
                return result;
            });
        }
        function revealCompetencyStack(index, job) {
            const button = solutionList.querySelector(`button[data-competency="${index}"]`);
            if (!button) return Promise.resolve(true);
            const item = copy[currentLanguage].competencies[index];
            const lines = button.closest('li').querySelectorAll('.competency-stack-line');
            return revealSequence(Array.from(lines, (line, lineIndex) => [line, item.stack[lineIndex]])).then((result) => {
                if (result) enableSolutionScrollIfOverflowing();
                requestAnimationFrame(refreshCustomScrollbars);
                return result;
            });
        }
        function selectCompetency(index) {
            if (selectedCompetency === index) return;
            const job = ++animationJob;
            const transition = ++competencyTransition;
            const activeStack = solutionList.querySelector('.competency-stack.is-open');
            const openSelected = () => {
                selectedCompetency = index;
                renderSolutionsList(selectedSection, true);
                solutionList.querySelectorAll('button[data-competency]').forEach((item) => item.classList.toggle('is-selected', Number(item.dataset.competency) === index));
                trackAnimation(revealCompetencyStack(index, job));
            };
            if (!activeStack) {
                openSelected();
                return;
            }
            const leaving = getTextItems('.competency-stack-line', activeStack);
            trackAnimation(reverseSequence(leaving, job)).then((completed) => {
                if (!completed || transition !== competencyTransition) return;
                openSelected();
            });
        }
        function revealLanding(landing, job) {
            const titleElements = detailPanel.querySelectorAll('.detail-kicker, .detail-title, .detail-lead');
            const items = [[titleElements[0], landing.kicker], [titleElements[1], landing.title], [titleElements[2], landing.lead]];
            detailPanel.querySelectorAll('.detail-timeline > div').forEach((element, index) => {
                items.push([element.querySelector('.timeline-value'), landing.milestones[index].value]);
                items.push([element.querySelector('.timeline-caption'), landing.milestones[index].caption]);
            });
            items.push([detailPanel.querySelector('.detail-package-title'), landing.package.baseTitle]);
            const packageItems = [...landing.package.items, ...landing.package.extras];
            detailPanel.querySelectorAll('.detail-current .detail-package li').forEach((element, index) => {
                items.push([element.querySelector('strong'), packageItems[index].title], [element.querySelector('span'), packageItems[index].text]);
            });
            items.push([detailPanel.querySelector('.detail-extras-title'), landing.package.extrasTitle]);
            items.push([detailPanel.querySelector('.detail-result-title'), landing.outcome.title]);
            items.push([detailPanel.querySelector('.detail-result-lead'), landing.outcome.lead]);
            items.push([detailPanel.querySelector('.detail-effects-title'), landing.outcome.effectsTitle]);
            detailPanel.querySelectorAll('.detail-effects li').forEach((element, index) => {
                items.push([element.querySelector('strong'), landing.outcome.effects[index].title], [element.querySelector('span'), landing.outcome.effects[index].text]);
            });
            const ctaText = detailPanel.querySelector('.detail-cta-text');
            const contact = detailPanel.querySelector('.detail-contact');
            const dots = detailPanel.querySelector('.loading-dots');
            items.push([detailPanel.querySelector('.telegram-contact'), landing.outcome.contact]);
            const previousCta = ctaText.textContent;
            contact.classList.remove('is-cta-ready');
            dots.textContent = '';
            const ctaJob = startTextAnimation(ctaText);
            const ctaAnimation = (previousCta && previousCta !== landing.outcome.cta
                ? morphText(ctaText, previousCta, landing.outcome.cta, ctaJob)
                : scrambleText(ctaText, landing.outcome.cta, ctaJob)
            ).then((result) => {
                if (result) {
                    contact.classList.add('is-cta-ready');
                    startLoadingDots(dots);
                }
                return result;
            });
            const animation = Promise.all([revealSequence(items, job), ctaAnimation]).then((results) => results.every(Boolean));
            requestAnimationFrame(alignDetailColumns);
            return animation;
        }
        function alignDetailColumns() {
            const timelineValues = detailPanel.querySelectorAll('.detail-timeline .timeline-value');
            const timelineValue = timelineValues[timelineValues.length - 1];
            const detailNext = detailPanel.querySelector('.detail-next');
            if (!timelineValue || !detailNext) return;
            detailNext.style.paddingTop = '0';
            const offset = timelineValue.getBoundingClientRect().top - detailNext.getBoundingClientRect().top;
            detailNext.style.paddingTop = `${Math.max(0, offset)}px`;
        }
        function randomGlitchSymbol(except) {
            let symbol = except;
            while (symbol === except) symbol = glyphs[Math.floor(Math.random() * glyphs.length)];
            return symbol;
        }
        function glitchText(element) {
            const original = element.dataset.glitchText;
            if (!original || element.dataset.glitching === 'true') return;
            const glitchJob = startGlitchAnimation(element);
            const characters = Array.from(original);
            const availableIndexes = characters.map((character, index) => (/\s/.test(character) ? -1 : index)).filter(index => index >= 0);
            if (!availableIndexes.length) return;
            const index = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
            const swaps = 3 + Math.floor(Math.random() * 2);
            let step = 0;
            element.dataset.glitching = 'true';
            const timer = setInterval(() => {
                if (!isCurrentGlitchAnimation(element, glitchJob) || !element.isConnected || element.dataset.isLeaving === 'true' || element.dataset.glitchText !== original) {
                    delete element.dataset.glitching;
                    clearInterval(timer);
                    return;
                }
                if (step >= swaps) {
                    element.textContent = original;
                    delete element.dataset.glitching;
                    clearInterval(timer);
                    return;
                }
                const glitched = [...characters];
                glitched[index] = randomGlitchSymbol(characters[index]);
                element.textContent = glitched.join('');
                step += 1;
            }, 85);
        }
        function startGlitchLoop() {
            setInterval(() => {
                if (Math.random() > .7) return;
                const candidates = Array.from(document.querySelectorAll('[data-glitch-text]')).filter((element) => element.dataset.isLeaving !== 'true' && element.textContent === element.dataset.glitchText);
                if (!candidates.length) return;
                const count = candidates.length > 1 && Math.random() < .25 ? 2 : 1;
                candidates.sort(() => Math.random() - .5).slice(0, count).forEach(glitchText);
            }, 700);
        }
        function startLoadingDots(element) {
            let step = 1;
            element.textContent = '';
            const timer = setInterval(() => {
                if (!element.isConnected || !element.closest('.detail-contact.is-cta-ready')) {
                    clearInterval(timer);
                    return;
                }
                element.textContent = '.'.repeat(step);
                step = (step + 1) % 4;
            }, 800);
        }
        options.forEach((option) => {
            option.addEventListener('mouseenter', () => setHighlight(option.dataset.language));
            option.addEventListener('focus', () => setHighlight(option.dataset.language));
            option.addEventListener('mouseleave', () => setHighlight(null));
            option.addEventListener('blur', () => setHighlight(null));
            option.addEventListener('click', () => runInteraction(() => openMenu(option.dataset.language)));
        });
        topOptions.forEach((option) => option.addEventListener('click', () => runInteraction(() => setMenuLanguage(option.dataset.language))));
        solutionList.addEventListener('transitionend', (event) => {
            if (event.target === solutionList && (event.propertyName === 'top' || event.propertyName === 'height')) {
                logSuboptionsState(`transition-end:${event.propertyName}`);
            }
        });
        menu.addEventListener('click', (event) => {
            const solutionButton = event.target.closest('button[data-menu-solution]');
            if (solutionButton) runInteraction(() => selectSolution(Number(solutionButton.dataset.menuSolution)));
            const button = event.target.closest('button[data-section]');
            if (button) runInteraction(() => selectSection(button.dataset.section));
        });
        solutionList.addEventListener('click', (event) => {
            const button = event.target.closest('button[data-solution]');
            if (button) runInteraction(() => selectSolution(Number(button.dataset.solution)));
            const competencyButton = event.target.closest('button[data-competency]');
            if (competencyButton) runInteraction(() => selectCompetency(Number(competencyButton.dataset.competency)));
        });
        backButton.addEventListener('click', () => runInteraction(() => {
            if (backTransitionActive) return;
            backTransitionActive = true;
            const job = ++animationJob;
            const transition = ++screenTransition;
            trackAnimation(reverseSequence(getDetailScreenText(), job)).then((completed) => {
                if (!completed || transition !== screenTransition) {
                    backTransitionActive = false;
                    return;
                }
                selectedSolution = null;
                prepareTextForReveal(getOptionsScreenText());
                updateDetail(job);
                syncRoute();
                trackAnimation(revealMenu(job));
                trackAnimation(revealSolutions(job));
                backTransitionActive = false;
            });
        }));
        window.addEventListener('resize', () => requestAnimationFrame(() => {
            alignDetailColumns();
            positionSolutionsList();
            refreshCustomScrollbars();
        }));
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('ui-ready');
            const route = getRouteFromUrl();
            if (route) {
                openRoute(route);
            } else {
                const job = ++animationJob;
                trackAnimation(revealSequence([
                    ...languageItems
                ], job));
            }
            document.fonts?.ready.then(() => positionSolutionsList());
            startGlitchLoop();
        });
    </script>
</body>
