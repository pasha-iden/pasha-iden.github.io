        function usesDistributedReveal(element) {

        function randomGlitchSymbol(except) {

        function glitchText(element) {
            const original = element.dataset.glitchText;

            const glitchJob = startGlitchAnimation(element);
            const characters = Array.from(original);
            const availableIndexes = characters.map((character, index) => (/\s/.test(character) ? -1 : index)).filter(index => index >= 0);
            if (!availableIndexes.length) return;
            const index = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
            const swaps = 3 + Math.floor(Math.random() * 2);
            let step = 0;
            element.dataset.glitching = 'true';
            const timer = setInterval(() => {
                if (!isCurrentGlitchAnimation(element, glitchJob) || !element.isConnected || element.dataset.isLeaving === 'true' || element.dataset.glitchText !== original) {
                    delete element.dataset.glitching;
                    clearInterval(timer);
                    return;
                }
                if (step >= swaps) {
                    element.textContent = original;
                    delete element.dataset.glitching;
                    clearInterval(timer);
                    return;

        function startGlitchLoop() {

                if (!candidates.length) return;

            }, 700);

        function previewCurrentLanguageRepaint() {

            const isGenerationGateOnTop = generationGateActive && !languageScreen.classList.contains('is-leaving');

                ? getLanguageScreenText()

            const selectedByElement = new Map();
            positions.sort(() => Math.random() - .5).slice(0, selectedCount).forEach(({ element, index }) => {
                if (!selectedByElement.has(element)) selectedByElement.set(element, []);
                selectedByElement.get(element).push(index);

                const text = items.find(([candidate]) => candidate === element)[1];

                    const original = Array.from(text)[index];

                        window.clearInterval(timer);
                        return;

                        element.dataset.glitchText = text;
                        delete element.dataset.glitching;
                        window.clearInterval(timer);
                        return;
                    }
                    const characters = Array.from(text);

                    step += 1;
                }, 220);
            });
